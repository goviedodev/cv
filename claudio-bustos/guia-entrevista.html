<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de Repaso Técnico</title>
<meta name="description" content="Guía de repaso para entrevista FullStack: Java/Spring, Angular, GCP, Kafka, Docker/Kubernetes, CI/CD, seguridad y agilidad.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127919;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16140f; --ink-soft:#4a453c; --ink-faint:#7d766a;
  --paper:#faf7f0; --surface:#fffdf8; --surface-2:#f2ede1;
  --line:#e0d8c6; --line-strong:#cdc2a9;
  --accent:#9a3412; --accent-soft:#fdeee3; --accent-line:#e8a87c;
  --focus:#1d4ed8; --ok:#15803d;
  --code-bg:#1f1c17; --code-ink:#ece6da; --code-key:#e8a87c; --code-str:#a3b18a; --code-com:#8a8272;
  --shadow: 0 1px 2px rgba(22,20,15,.06), 0 8px 28px -12px rgba(22,20,15,.18);
  --sidebar-w: 310px;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --ink:#ece7dc; --ink-soft:#b3ab9c; --ink-faint:#837c6f;
  --paper:#14120f; --surface:#1b1814; --surface-2:#241f1a;
  --line:#322c25; --line-strong:#463e34;
  --accent:#f0a97a; --accent-soft:#2a1d14; --accent-line:#7a4a28;
  --focus:#8ab4f8; --ok:#7fbf8a;
  --code-bg:#0e0c0a; --code-ink:#ece6da;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:2rem}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.72;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);gap:0;max-width:1500px;margin:0 auto}
.sidebar{
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--line);background:var(--surface);padding:1.4rem 1.1rem 4rem;
}
.sidebar::-webkit-scrollbar{width:9px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
main{padding:3.2rem clamp(1.1rem,4vw,4.5rem) 8rem}
.doc{max-width:74ch;margin:0 auto}

/* ---------- Brand / sidebar ---------- */
.brand{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.35rem}
.brand b{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:-.01em}
.brand span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.brand-sub{font-size:.8rem;color:var(--ink-faint);margin:0 0 1rem;line-height:1.45}
.tools{display:flex;gap:.4rem;margin-bottom:.9rem}
.search{flex:1;position:relative}
.search input{
  width:100%;padding:.5rem .65rem .5rem 1.9rem;font:inherit;font-size:.85rem;
  background:var(--paper);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;
}
.search input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.search::before{content:"\2315";position:absolute;left:.6rem;top:50%;transform:translateY(-52%);color:var(--ink-faint);font-size:1rem}
.iconbtn{
  border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);
  border-radius:8px;width:36px;cursor:pointer;font-size:.95rem;line-height:1;
  transition:background .15s,color .15s,transform .15s;
}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent);transform:translateY(-1px)}
.iconbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.progress-wrap{margin:0 0 1rem;font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em}
.bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:.35rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-line),var(--accent));transition:width .4s cubic-bezier(.16,1,.3,1)}

nav#toc ol{list-style:none;margin:0;padding:0;counter-reset:sec}
nav#toc > ol > li{counter-increment:sec}
nav#toc a{
  display:block;padding:.34rem .55rem .34rem 2.1rem;position:relative;
  color:var(--ink-soft);text-decoration:none;font-size:.855rem;border-radius:7px;line-height:1.4;
  transition:background .14s,color .14s;
}
nav#toc > ol > li > a::before{
  content:counter(sec);position:absolute;left:.5rem;top:.34rem;
  font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);
  width:1.3rem;text-align:right;
}
nav#toc a:hover{background:var(--surface-2);color:var(--ink)}
nav#toc a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav#toc a.active::before{color:var(--accent)}
nav#toc .sub{margin-left:1.55rem;border-left:1px solid var(--line);padding-left:.3rem}
nav#toc .sub a{padding-left:.6rem;font-size:.79rem;color:var(--ink-faint)}
nav#toc .sub a:hover{color:var(--ink-soft)}
nav#toc li.hidden{display:none}
nav#toc li.done > a::after{content:"\2713";position:absolute;right:.5rem;color:var(--ok);font-size:.75rem}

/* ---------- Document typography ---------- */
.doc h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(2.3rem,1.4rem + 3.2vw,3.7rem);
  line-height:1.08;letter-spacing:-.02em;margin:0 0 .6rem;
}
.doc h2{
  font-family:var(--serif);font-weight:400;font-size:clamp(1.75rem,1.2rem + 1.7vw,2.5rem);
  line-height:1.15;letter-spacing:-.015em;margin:0 0 1rem;scroll-margin-top:1.5rem;
}
.doc h3{font-size:1.19rem;font-weight:650;margin:2.4rem 0 .6rem;letter-spacing:-.005em;scroll-margin-top:1.5rem}
.doc h4{font-size:1rem;font-weight:650;margin:1.7rem 0 .4rem;color:var(--ink-soft)}
.doc p{margin:0 0 1.05rem}
.doc a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.doc a:hover{text-decoration-thickness:2px}
.doc strong{font-weight:650}
.doc hr{border:0;border-top:1px solid var(--line);margin:2.6rem 0}
.doc ul,.doc ol{margin:0 0 1.05rem;padding-left:1.35rem}
.doc li{margin:.28rem 0}
.doc li::marker{color:var(--accent-line)}

.tgt{
  display:inline-block;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent-line);border-radius:999px;
  font-size:.62rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  padding:.1rem .48rem;vertical-align:.18em;margin-left:.4rem;white-space:nowrap;
}

.doc blockquote{
  margin:1.5rem 0;padding:1rem 1.2rem;background:var(--surface);
  border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;
  color:var(--ink-soft);box-shadow:var(--shadow);
}
.doc blockquote p:last-child{margin-bottom:0}
.doc blockquote em{color:var(--ink);font-style:italic}

.tablewrap{overflow-x:auto;margin:1.4rem 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.doc table{border-collapse:collapse;width:100%;font-size:.895rem}
.doc th{
  text-align:left;padding:.7rem .95rem;background:var(--surface-2);color:var(--ink);
  font-weight:650;font-size:.73rem;letter-spacing:.07em;text-transform:uppercase;
  border-bottom:1px solid var(--line-strong);white-space:nowrap;
}
.doc td{padding:.68rem .95rem;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55}
.doc tbody tr:last-child td{border-bottom:0}
.doc tbody tr:hover{background:var(--accent-soft)}
.doc td:first-child{font-weight:550}

.doc :not(pre) > code{
  font-family:var(--mono);font-size:.845em;background:var(--surface-2);
  border:1px solid var(--line);border-radius:5px;padding:.08em .34em;color:var(--accent);
}
.codeblock{position:relative;margin:1.4rem 0}
.doc pre{
  margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:12px;
  padding:1.15rem 1.25rem;overflow-x:auto;font-size:.83rem;line-height:1.66;
  border:1px solid var(--line-strong);box-shadow:var(--shadow);
}
.doc pre code{font-family:var(--mono);background:none;border:0;padding:0;color:inherit}
.codeblock .lang{
  position:absolute;top:.55rem;right:3.4rem;font-family:var(--mono);font-size:.64rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--code-com);pointer-events:none;
}
.copy{
  position:absolute;top:.45rem;right:.5rem;background:rgba(255,255,255,.07);color:#cfc8ba;
  border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:.18rem .5rem;
  font-size:.68rem;font-family:var(--sans);cursor:pointer;opacity:0;transition:opacity .15s,background .15s;
}
.codeblock:hover .copy,.copy:focus{opacity:1}
.copy:hover{background:rgba(255,255,255,.16)}
.tok-com{color:var(--code-com);font-style:italic}
.tok-str{color:var(--code-str)}
.tok-key{color:var(--code-key)}

.sechead{display:flex;align-items:flex-start;gap:.75rem;margin:0 0 1rem;padding-top:1.4rem;border-top:1px solid var(--line)}
.sechead h2{flex:1;margin:0}
.secmark{
  margin-top:.55rem;flex:none;display:inline-flex;align-items:center;gap:.35rem;
  font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
  padding:.24rem .6rem;cursor:pointer;user-select:none;white-space:nowrap;
  transition:background .18s,color .18s,border-color .18s,transform .18s;
}
.secmark:hover{border-color:var(--accent-line);color:var(--accent);transform:translateY(-1px)}
.secmark.on{background:var(--ok);border-color:var(--ok);color:#fff}
.secspacer{height:3rem}

.hero{margin-bottom:2.4rem}
.kicker{
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin:0 0 .7rem;
}
.hero .lede{font-size:1.02rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:1.4rem 0 0}
.chip{
  font-size:.74rem;padding:.24rem .6rem;border:1px solid var(--line-strong);
  border-radius:999px;color:var(--ink-soft);background:var(--surface);
}

.mobilebar{display:none}
@media (max-width:1000px){
  .shell{grid-template-columns:1fr}
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:min(86vw,var(--sidebar-w));z-index:50;
    transform:translateX(-102%);transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow);
  }
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  .mobilebar{
    display:flex;align-items:center;gap:.6rem;position:sticky;top:0;z-index:30;
    background:var(--paper);border-bottom:1px solid var(--line);padding:.55rem .9rem;
  }
  .mobilebar b{font-family:var(--serif);font-weight:400;font-size:1.05rem}
  main{padding:1.6rem 1rem 6rem}
  body{font-size:16px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  html{scroll-behavior:auto}
}
@media print{
  .sidebar,.mobilebar,.copy,.secmark,.tools{display:none !important}
  .shell{display:block}
  main{padding:0}
  .doc{max-width:none}
  .doc h2{page-break-after:avoid;break-after:avoid}
  .doc pre{white-space:pre-wrap;border:1px solid #999;background:#f6f6f6;color:#111;box-shadow:none}
  .tok-com,.tok-str,.tok-key{color:#111}
  .tablewrap{box-shadow:none}
  body{background:#fff;color:#000;font-size:10.5pt}
}
.fallback{padding:2rem;font-family:var(--mono);font-size:.8rem;white-space:pre-wrap}
</style>
</head>

  <button class="iconbtn" id="navToggle" aria-label="Abrir indice">&#9776;</button>

  <main>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";

  var raw = document.getElementById('md').textContent.trim();
  var md = new TextDecoder('utf-8').decode(
    Uint8Array.from(atob(raw), function (c) { return c.charCodeAt(0); })
  );

  var docEl = document.getElementById('doc');

  if (typeof marked === 'undefined') {
    docEl.innerHTML = '';
    var pre0 = document.createElement('pre');
    pre0.className = 'fallback';
    pre0.textContent = md;
    docEl.appendChild(pre0);
    return;
  }

  marked.setOptions({ gfm: true, breaks: false, headerIds: false, mangle: false });
  docEl.innerHTML = marked.parse(md);

  /* the markdown index is replaced by the sidebar */
  (function removeMdIndex() {
    var hs = docEl.querySelectorAll('h2');
    for (var i = 0; i < hs.length; i++) {
      if (hs[i].textContent.trim().toLowerCase().indexOf('ndice') > -1) {
        var n = hs[i].nextElementSibling;
        while (n && n.tagName !== 'H2' && n.tagName !== 'HR') {
          var next = n.nextElementSibling; n.remove(); n = next;
        }
        if (n && n.tagName === 'HR') n.remove();
        hs[i].remove();
        break;
      }
    }
  })();

  (function buildHero() {
    var h1 = docEl.querySelector('h1');
    if (!h1) return;
    var hero = document.createElement('header');
    hero.className = 'hero';
    var kicker = document.createElement('p');
    kicker.className = 'kicker';
    kicker.textContent = 'Preparacion de entrevista';
    h1.parentNode.insertBefore(hero, h1);
    hero.appendChild(kicker);
    hero.appendChild(h1);
    var n = hero.nextElementSibling;
    if (n && n.tagName === 'BLOCKQUOTE') { n.classList.add('lede'); hero.appendChild(n); }
    var chips = document.createElement('div');
    chips.className = 'chips';
    ['FullStack','Angular','CI/CD','Agilidad','Java funcional','Virtual Threads',
     'Spring Boot','JWT / OAuth2','GCP Pub/Sub','Kafka','Firestore','Docker',
     'Kubernetes','Patrones','Sueldo'].forEach(function (t) {
      var s = document.createElement('span'); s.className = 'chip'; s.textContent = t; chips.appendChild(s);
    });
    hero.appendChild(chips);
  })();

  /* target emoji -> badge */
  docEl.querySelectorAll('h2,h3,h4,li,td,p,strong,em').forEach(function (el) {
    if (el.innerHTML.indexOf('🎯') !== -1) {
      el.innerHTML = el.innerHTML.replace(/\s*🎯/g, ' <span class="tgt">clave</span>');
    }
  });

  docEl.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tablewrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  var KEYWORDS = /\b(public|private|protected|static|final|void|class|interface|record|enum|extends|implements|new|return|if|else|for|while|try|catch|throw|throws|import|package|this|super|const|let|var|function|export|from|async|await|type|readonly|apiVersion|kind|FROM|RUN|COPY|WORKDIR|ENTRYPOINT|EXPOSE|USER|ENV|HEALTHCHECK|select|where|allow|match|rules_version)\b/g;
  var MARK = '␟';

  docEl.querySelectorAll('pre > code').forEach(function (code) {
    var pre = code.parentNode;
    var wrap = document.createElement('div'); wrap.className = 'codeblock';
    pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);

    var cls = (code.className || '').match(/language-([\w-]+)/);
    if (cls) {
      var tag = document.createElement('span'); tag.className = 'lang'; tag.textContent = cls[1]; wrap.appendChild(tag);
    }

    var source = code.textContent;
    var btn = document.createElement('button');
    btn.className = 'copy'; btn.type = 'button'; btn.textContent = 'copiar';
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(source).then(function () {
        btn.textContent = 'copiado';
        setTimeout(function () { btn.textContent = 'copiar'; }, 1600);
      });
    });
    wrap.appendChild(btn);

    var html = source.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var stash = [];
    function keep(re, cls2) {
      html = html.replace(re, function (m) {
        stash.push('<span class="' + cls2 + '">' + m + '</span>');
        return MARK + (stash.length - 1) + MARK;
      });
    }
    /* strings first so that // and # inside them are never taken as comments */
    keep(/("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g, 'tok-str');
    try {
      keep(/(?<![:\w])\/\/[^\n]*|(?<=^|\s)#[^\n]*|\/\*[\s\S]*?\*\//gm, 'tok-com');
    } catch (e) {
      keep(/(^|\s)\/\/[^\n]*|\/\*[\s\S]*?\*\//gm, 'tok-com');
    }
    html = html.replace(KEYWORDS, '<span class="tok-key">$&</span>');
    for (var i = 0; i < stash.length; i++) {
      html = html.split(MARK + i + MARK).join(stash[i]);
    }
    code.innerHTML = html;
  });

  function slug(s) {
    return s.toLowerCase().replace(/\s*clave\s*$/, '')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60);
  }
  var used = {};
  var heads = Array.prototype.slice.call(docEl.querySelectorAll('h2,h3'));
  heads.forEach(function (h) {
    var base = slug(h.textContent) || 'sec';
    used[base] = (used[base] || 0) + 1;
    h.id = used[base] > 1 ? base + '-' + used[base] : base;
  });

  var toc = document.getElementById('toc');
  var rootList = document.createElement('ol');
  var currentSub = null;

  heads.forEach(function (h) {
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/^\d+(\.\d+)*\.?\s*/, '').replace(/\s*clave\s*$/, '').trim();
    a.dataset.target = h.id;

    if (h.tagName === 'H2') {
      var li = document.createElement('li');
      li.dataset.section = h.id;
      li.appendChild(a);
      currentSub = document.createElement('ol');
      currentSub.className = 'sub';
      li.appendChild(currentSub);
      rootList.appendChild(li);
    } else if (currentSub) {
      var sli = document.createElement('li');
      sli.appendChild(a);
      currentSub.appendChild(sli);
    }
  });
  toc.appendChild(rootList);

  var KEY = 'guia-entrevista-progreso';
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { done = {}; }

  var sections = Array.prototype.slice.call(docEl.querySelectorAll('h2'));
  sections.forEach(function (h) {
    var head = document.createElement('div');
    head.className = 'sechead';
    h.parentNode.insertBefore(head, h);
    head.appendChild(h);

    var mark = document.createElement('button');
    mark.type = 'button';
    mark.className = 'secmark';
    head.appendChild(mark);

    function render() {
      var on = !!done[h.id];
      mark.classList.toggle('on', on);
      mark.textContent = on ? 'repasada' : 'marcar repasada';
      mark.setAttribute('aria-pressed', on ? 'true' : 'false');
      var li = toc.querySelector('li[data-section="' + h.id + '"]');
      if (li) li.classList.toggle('done', on);
    }
    mark.addEventListener('click', function () {
      if (done[h.id]) { delete done[h.id]; } else { done[h.id] = 1; }
      try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {}
      render(); updateProgress();
    });
    render();
  });

  var bar = document.getElementById('progressBar');
  var label = document.getElementById('progressLabel');
  function updateProgress() {
    var total = sections.length, n = 0;
    sections.forEach(function (h) { if (done[h.id]) n++; });
    bar.style.width = total ? (n / total * 100) + '%' : '0%';
    label.textContent = n + ' de ' + total + ' secciones repasadas';
  }
  updateProgress();

  var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
  var byId = {};
  links.forEach(function (a) { byId[a.dataset.target] = a; });
  var sidebarEl = document.getElementById('sidebar');
  var spy = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (a) { a.classList.remove('active'); });
      var a = byId[e.target.id];
      if (!a) return;
      a.classList.add('active');
      var top = a.offsetTop;
      if (top < sidebarEl.scrollTop || top > sidebarEl.scrollTop + sidebarEl.clientHeight - 60) {
        sidebarEl.scrollTo({ top: Math.max(0, top - 180), behavior: 'smooth' });
      }
    });
  }, { rootMargin: '-8% 0px -80% 0px', threshold: 0 });
  heads.forEach(function (h) { spy.observe(h); });

  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var term = q.value.trim().toLowerCase();
    Array.prototype.slice.call(rootList.children).forEach(function (li) {
      var selfMatch = li.firstChild.textContent.toLowerCase().indexOf(term) !== -1;
      var subs = Array.prototype.slice.call(li.querySelectorAll('.sub li'));
      var anySub = false;
      subs.forEach(function (s) {
        var m = !term || selfMatch || s.textContent.toLowerCase().indexOf(term) !== -1;
        s.classList.toggle('hidden', !m);
        if (m) anySub = true;
      });
      li.classList.toggle('hidden', !(!term || selfMatch || anySub));
    });
  });

  var TKEY = 'guia-entrevista-tema';
  var saved = null;
  try { saved = localStorage.getItem(TKEY); } catch (e) {}
  if (saved) { document.documentElement.setAttribute('data-theme', saved); }
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem(TKEY, cur); } catch (e) {}
  }
  document.getElementById('themeToggle').addEventListener('click', toggleTheme);
  document.getElementById('themeToggleM').addEventListener('click', toggleTheme);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });

  document.getElementById('navToggle').addEventListener('click', function () {
    document.body.classList.toggle('nav-open');
  });
  sidebarEl.addEventListener('click', function (e) {
    if (e.target.tagName === 'A') document.body.classList.remove('nav-open');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.body.classList.remove('nav-open');
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
})();
</script>
</body>
</html>
